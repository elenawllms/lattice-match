services:
  # See https://render.com/docs/blueprint-spec for more info on render blueprints
  - type: web
    name: lattice-match
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # src/app.py exposes `server = app.server`. Bind explicitly to $PORT --
    # gunicorn's own default is 127.0.0.1:8000, which Render cannot reach.
    # The app module no longer starts a server of its own at import time.
    startCommand: gunicorn --chdir src app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
